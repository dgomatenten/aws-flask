<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --danger: #b91c1c;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #dbeafe, var(--bg));
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .error {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 0.92rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin: 10px 0 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.96rem;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    button {
      margin-top: 16px;
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 0.96rem;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
    }

    button:hover {
      background: #115e59;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Sign In</h1>
    <p>Use your ID and password to login.</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/login">
      <label for="username">ID</label>
      <input id="username" name="username" type="text" value="{{ username or '' }}" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required>

      <button type="submit">Login</button>
    </form>
  </section>
</body>
</html>
